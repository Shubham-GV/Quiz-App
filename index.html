<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <meta name="description" content="A simple computer science quiz app built with HTML, CSS and JavaScript." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">

    <!-- Start screen -->
    <section id="start-screen" class="screen">
      <h1>Quiz App</h1>
      <p class="subtitle">Test your computer science basics.</p>
      <ul class="rules">
        <li><span id="rule-count">10</span> random questions</li>
        <li><span id="rule-time">20</span> seconds per question</li>
        <li>Tip: press 1 to 4 on your keyboard to answer</li>
      </ul>
      <p id="best-score" class="best" hidden></p>
      <button id="start-btn" class="btn primary" type="button">Start quiz</button>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="screen" hidden>
      <div class="top-row">
        <span id="progress-text">Question 1 of 10</span>
        <span id="timer" aria-live="off">20s</span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

      <h2 id="question-text"></h2>
      <div id="options" class="options"></div>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div class="bottom-row">
        <span id="score-text">Score: 0</span>
        <button id="next-btn" class="btn primary" type="button" hidden>Next</button>
      </div>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen" hidden>
      <h2>Quiz complete</h2>
      <p id="result-score" class="big-score"></p>
      <p id="result-message" class="subtitle"></p>

      <div id="review" hidden>
        <h3>Review your mistakes</h3>
        <ul id="review-list"></ul>
      </div>

      <button id="restart-btn" class="btn primary" type="button">Play again</button>
    </section>

  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
